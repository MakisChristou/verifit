apply plugin: 'com.android.application'

android {
    compileSdk 34
    buildToolsVersion "34.0.0"
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    defaultConfig {
        applicationId "com.whatever.verifit"
        minSdk 21
        targetSdk 34
        versionCode 14
        versionName "1.0.14"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        multiDexEnabled true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.fragment:fragment-ktx:1.7.1'
    implementation 'androidx.fragment:fragment:1.7.1'
    implementation 'androidx.activity:activity:1.9.0'
    implementation 'androidx.activity:activity-ktx:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0-alpha15'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.navigation:navigation-fragment:2.8.0-beta02'
    implementation 'androidx.navigation:navigation-ui:2.8.0-beta02'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'com.applandeo:material-calendar-view:1.9.0-rc04'
    testImplementation 'junit:junit:4.12'
    androidTestImplementation 'androidx.test.ext:junit:1.1.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.2.0'
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'  // Note: Latest stable is v3.1.0, but consider upgrading to v4.0.0+ when stable
    implementation 'com.github.thegrizzlylabs:sardine-android:0.9'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'  // Required by sardine-android
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.android.volley:volley:1.2.1'
}